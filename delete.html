<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8" />
 <meta name="viewport" content="width=device-width, initial-scale=1" />
 <title>Delete Bookmarks</title>
 <link rel="stylesheet" href="bookmark.css" />
</head>
<body>
 <img class="image-gradient" src="gradient.png" alt="gradient" />
 <div class="layer-blur"></div>
 <div class="container">
 <header>
 <h1 class="logo">BOOKMARK</h1>
 <nav>
 <a href="index.html">HOME</a>
 <a href="add.html">ADD</a>
 <a href="view.html">VIEW</a>
 <a href="edit.html">EDIT</a>
 <a href="organize.html">ORGANIZE</a>
 <a href="import-export.html">IMPORT/EXPORT</a>
 </nav>
 <button class="btn-signing">SIGN IN</button>
 </header>

 <main>
 <div class="content">
 <h1>Delete Bookmarks</h1>
 <p class="description">Click "Delete" next to any bookmark to remove it permanently.</p>
 <ul id="bookmarkList"></ul>
 </div>
 </main>
 </div>

 <script>
 function renderDeletableBookmarks() {
 const list = document.getElementById('bookmarkList');
 const bookmarks = JSON.parse(localStorage.getItem('bookmarks') || '[]');
 list.innerHTML = '';

 if (bookmarks.length === 0) {
 list.innerHTML = '<li>No bookmarks to delete.</li>';
 return;
 }

 bookmarks.forEach((bm, index) => {
 const li = document.createElement('li');
 li.innerHTML = `
 <a href="${bm.url}" target="_blank">${bm.title}</a>
 <button onclick="deleteBookmark(${index})">Delete</button>
 `;
 list.appendChild(li);
 });
 }

 function deleteBookmark(index) {
 const bookmarks = JSON.parse(localStorage.getItem('bookmarks') || '[]');
 bookmarks.splice(index, 1);
 localStorage.setItem('bookmarks', JSON.stringify(bookmarks));
 renderDeletableBookmarks();
 }

 renderDeletableBookmarks();
 </script>
</body>
</html>
