<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8" />
 <meta name="viewport" content="width=device-width, initial-scale=1" />
 <title>View Bookmarks</title>
 <link rel="stylesheet" href="bookmark.css" />
</head>
<body>
 <img class="image-gradient" src="gradient.png" alt="gradient" />
 <div class="layer-blur"></div>
 <div class="container">
 <header>
 <h1 class="logo">BOOKMARK</h1>
 <nav>
 <a href="index.html">HOME</a>
 <a href="add.html">ADD</a>
 <a href="edit.html">EDIT</a>
 <a href="organize.html">ORGANIZE</a>
 <a href="import-export.html">IMPORT/EXPORT</a>
 <a href="delete.html">DELETE</a>
 </nav>
 <button class="btn-signing">SIGN IN</button>
 </header>

 <main>
 <div class="content">
 <h1>Your Bookmarks</h1>
 <p class="description">Browse all your saved websites below.</p>
 <ul id="bookmarkList"></ul>
 </div>
 </main>
 </div>

 <script>
 function renderBookmarks() {
 const list = document.getElementById('bookmarkList');
 const bookmarks = JSON.parse(localStorage.getItem('bookmarks') || '[]');
 list.innerHTML = '';

 if (bookmarks.length === 0) {
 list.innerHTML = '<li>No bookmarks found.</li>';
 return;
 }

 bookmarks.forEach(bm => {
 const li = document.createElement('li');
 li.innerHTML = `<a href="${bm.url}" target="_blank">${bm.title}</a>`;
 list.appendChild(li);
 });
 }

 renderBookmarks();
 </script>
</body>
</html>
